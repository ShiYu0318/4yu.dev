<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4yü/專案</title>
  <meta name="description" content="4yü（ShiYu0318）的專案：強化學習、RAG、AI Agent、研究、城市與校園工具、教學。">
  <meta name="theme-color" content="#07081a">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="content/img/profile/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="content/img/profile/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Noto+Sans+TC:wght@400;500&family=Tinos&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="page-home">
  <div class="progress" aria-hidden="true"></div>
  <div class="curtain" aria-hidden="true"><span class="wordmark"><span class="wordmark-path">~/</span>4yü</span></div>
  <div class="cursor" aria-hidden="true"><span class="cursor-dot"></span><span class="cursor-ring"><span class="cursor-label"></span></span></div>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="回到首頁"><span class="wordmark-path">~/</span>4yü</a>
    <nav class="nav" aria-label="主要連結">
      <span class="nav-hover" aria-hidden="true"></span>
      <a href="#projects">專案</a>
      <a href="experience.html">經歷</a>
      <a href="#contact">聯絡</a>
      <a href="https://4yu.dev" target="_blank" rel="noopener">Blog</a>
      <button class="search-trigger" type="button" data-palette-open aria-label="搜尋專案">搜尋 <kbd>⌘K</kbd></button>
    </nav>
  </header>

  <main>
    <section id="hero" class="hero" aria-label="自我介紹"></section>

    <div class="marquee" aria-hidden="true"><div class="marquee-track"></div></div>

    <section id="projects" class="projects" aria-labelledby="projects-title">
      <div class="projects-head">
        <h2 id="projects-title">專案 <span id="project-count" class="meta"></span></h2>
        <div class="controls">
          <div id="filters" class="segmented" role="tablist" aria-label="依領域篩選"></div>
          <div id="views" class="segmented views" role="radiogroup" aria-label="顯示方式"></div>
        </div>
      </div>
      <div id="view-rows" class="view lead" data-view="rows"></div>
      <div id="view-grid" class="view grid" data-view="grid" hidden></div>
      <div id="view-table" class="view" data-view="table" hidden>
        <div class="index-head" aria-hidden="true"><span>No.</span><span>專案</span><span>領域</span><span>年份</span></div>
        <ol id="index" class="index"></ol>
      </div>
      <p id="empty" class="empty" hidden>這個領域還沒有專案</p>
    </section>

    <section id="experience" class="exp-preview" aria-labelledby="exp-title">
      <div class="projects-head">
        <h2 id="exp-title">經歷 <span id="exp-count" class="meta"></span></h2>
        <a class="button" href="experience.html">全部經歷<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
      </div>
      <ol id="exp-latest" class="exp-list"></ol>
    </section>
  </main>

  <footer id="contact" class="site-footer"></footer>

  <div class="preview" aria-hidden="true"></div>
  <dialog id="palette" class="palette" aria-label="搜尋專案">
    <input id="palette-input" type="search" placeholder="搜尋專案" autocomplete="off" aria-controls="palette-list">
    <ul id="palette-list" class="palette-list" role="listbox"></ul>
    <p class="palette-hint meta"><kbd>↑</kbd><kbd>↓</kbd> 選擇　<kbd>Enter</kbd> 開啟　<kbd>Esc</kbd> 關閉</p>
  </dialog>

  <script src="assets/vendor/gsap.min.js" defer></script>
  <script src="assets/vendor/ScrollTrigger.min.js" defer></script>
  <script src="assets/vendor/SplitText.min.js" defer></script>
  <script src="assets/vendor/ScrambleTextPlugin.min.js" defer></script>
  <script src="assets/vendor/lenis.min.js" defer></script>
  <script src="assets/vendor/Flip.min.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
