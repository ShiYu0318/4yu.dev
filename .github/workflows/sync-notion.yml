# 每天從 Notion「經歷」表格同步「網站」打勾的列到 content/experience.json（AGENTS.md §9）
# 需要在 repo 的 Settings → Secrets and variables → Actions 設定：
#   NOTION_TOKEN            Notion integration 的 token（該 integration 要被加進經歷表格的 Connections）
#   NOTION_DATA_SOURCE_ID   經歷表格的 data source id
name: Sync experience from Notion

on:
  schedule:
    - cron: "17 19 * * *"   # 每天台灣時間 03:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: python3 scripts/sync_notion.py
      - name: Commit if changed
        run: |
          if git diff --quiet content/experience.json; then echo "沒有變動"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/experience.json
          git commit -m "content: sync experience from Notion"
          git push
